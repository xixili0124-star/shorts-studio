<style>

<body>
<main>
  <h1>PC 스튜디오 DOM 통합 검사</h1>
  <p>별도 검수 주소의 빈 편집기를 사용합니다. 테스트 자막과 퀵포맷을 추가·수정한 뒤 정리하며 AI 처리, 다운로드, 사용자 프로젝트 교체는 실행하지 않습니다.</p>
  <p>실제 앱 DOM과 합성 클릭·포인터·키보드 이벤트로 UI 연결을 검사합니다. 오른쪽 고정 미리보기와 왼쪽 편집 영역을 픽셀로 측정합니다. 390px 전환은 실제 휴대전화의 터치·OS 검증을 대신하지 않습니다.</p>
  <div class="actions"><button id="runAll" disabled>전체 검사 실행</button><span id="status">편집기 준비 중…</span></div>
  <ol id="checks"></ol>
  <pre id="result" role="status">준비 중…</pre>
  <div id="frameHost"><iframe id="studio" title="독립 PC 편집기 검사" src="/studio.html?empty"></iframe></div>
</main>
<script type="module">
// 검수 전용 페이지입니다. 별도 localhost 포트에서 public/_test/desktop.html로 복사합니다.
const $=id=>document.getElementById(id),iframe=$('studio'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
let doc,win,running=false,ready=false;
const errors=[],originals=new Map(),captionText='검수용 자막 · PC와 모바일에서 같은 문구';
const settle=async()=>{await wait(60);await new Promise(resolve=>requestAnimationFrame(resolve));};
const visible=node=>!!node?.isConnected&&node.getClientRects().length>0&&win.getComputedStyle(node).visibility!=='hidden';
const q=selector=>{const node=doc.querySelector(selector);assert(node,'찾을 수 없는 요소: '+selector);return node;};
async function until(check,message,timeout=3000){const end=performance.now()+timeout;while(performance.now()<end){if(check())return;await wait(40);}throw new Error(message);}
async function click(selector){const node=typeof selector==='string'?q(selector):selector;assert(visible(node),'보이지 않는 버튼: '+(node.id||node.outerHTML.slice(0,150)));assert(!node.disabled,'비활성 버튼: '+(node.id||node.textContent));node.click();await settle();}
async function input(selector,value){const node=q(selector);assert(visible(node),'보이지 않는 입력: '+selector);node.focus();node.value=value;node.dispatchEvent(new win.Event('input',{bubbles:true}));node.dispatchEvent(new win.Event('change',{bubbles:true}));await settle();}
function uniqueIds(){const seen=new Set();for(const node of doc.querySelectorAll('[id]')){assert(!seen.has(node.id),'중복 ID: '+node.id);seen.add(node.id);}}
const group=key=>click('[data-desktop-group="'+key+'"]');
const tab=key=>click('[data-desktop-tab="'+key+'"]');
const inspectorTab=key=>click('[data-desktop-inspector="'+key+'"]');
const activeInspector=()=>doc.querySelector('[data-desktop-inspector][aria-pressed="true"]')?.dataset.desktopInspector;
const captions=()=>[...doc.querySelectorAll('.timeline-block[data-type="caption"]')];
const titleOf=node=>[...(node.querySelector('h3')?.childNodes||[])].filter(child=>child.nodeType===3).map(child=>child.textContent).join('').trim();
const captionSections=()=>[...q('#inspectorContent').children].filter(node=>node.matches('.property-section'));
const rect=selector=>q(selector).getBoundingClientRect();
const near=(actual,expected,message,tolerance=1.5)=>assert(Math.abs(actual-expected)<=tolerance,message+' ('+actual.toFixed(2)+' / '+expected.toFixed(2)+')');
function sameRect(actual,expected,message){for(const key of ['left','top','width','height'])near(actual[key],expected[key],message+' · '+key);}
function desktopGeometry(label){
  const work=rect('#workbench'),viewer=rect('.viewer'),library=rect('#library'),timeline=rect('.timeline-panel'),inspector=rect('#inspector');
  near(viewer.top,work.top,label+' · 미리보기가 상단부터 시작하지 않습니다');
  near(viewer.bottom,work.bottom,label+' · 미리보기가 하단까지 이어지지 않습니다');
  near(viewer.right,work.right,label+' · 미리보기가 오른쪽 끝에 고정되지 않습니다');
  near(timeline.left,work.left,label+' · 타임라인 왼쪽이 작업 영역과 어긋납니다');
  near(timeline.right,viewer.left,label+' · 타임라인이 미리보기 아래로 넘어가거나 중간에 빈 열이 남습니다');
  near(timeline.bottom,work.bottom,label+' · 타임라인이 왼쪽 하단에 있지 않습니다');
  near(library.top,work.top,label+' · 라이브러리 상단이 어긋납니다');
  near(library.bottom,timeline.top,label+' · 라이브러리가 타임라인 위까지만 차지하지 않습니다');
  if(visible(q('#inspector'))){
    near(library.right,inspector.left,label+' · 라이브러리와 속성 사이에 빈 공간이 생겼습니다');
    near(inspector.right,viewer.left,label+' · 속성이 미리보기 왼쪽에 있지 않습니다');
    near(inspector.top,work.top,label+' · 속성이 왼쪽 상단 영역을 벗어납니다');
    near(inspector.bottom,timeline.top,label+' · 속성이 타임라인으로 내려갑니다');

  }else near(library.right,viewer.left,label+' · 선택이 없는데 속성 자리의 빈 공간이 남습니다');

async function key(selector,keyName,options={}){const node=q(selector);assert(visible(node),'보이지 않는 키보드 조작: '+selector);node.focus();node.dispatchEvent(new win.KeyboardEvent('keydown',{key:keyName,bubbles:true,cancelable:true,...options}));await settle();}
let nextPointer=700000;
async function timelineTap(node,{ctrlKey=false}={}){
  node.scrollIntoView({block:'nearest',inline:'nearest'});await settle();
  const box=node.getBoundingClientRect(),at={x:box.left+Math.min(45,box.width/2),y:box.top+box.height*.7},target=doc.elementFromPoint(at.x,at.y),id=++nextPointer;
  assert(target?.closest('.timeline-block')?.dataset.id===node.dataset.id,'타임라인 클립이 다른 요소에 가려져 선택할 수 없습니다.');
  const captures=new Map(),saved=new Map(),proto=win.Element.prototype;
  // 이 합성 포인터 ID만 캡처를 모사합니다. 실제 사용자 포인터와 앱 코드는 변경하지 않습니다.
  for(const name of ['setPointerCapture','hasPointerCapture','releasePointerCapture']){
    const original=proto[name];saved.set(name,original);proto[name]=function(pointer){if(pointer!==id)return original.call(this,pointer);if(name==='setPointerCapture'){captures.set(id,this);return;}if(name==='hasPointerCapture')return captures.get(id)===this;if(captures.get(id)===this)captures.delete(id);};
  }
  const event=type=>new win.PointerEvent(type,{pointerId:id,pointerType:'mouse',isPrimary:true,bubbles:true,cancelable:true,composed:true,clientX:at.x,clientY:at.y,button:0,buttons:type==='pointerdown'?1:0,ctrlKey});
  try{target.dispatchEvent(event('pointerdown'));(captures.get(id)||target).dispatchEvent(event('pointerup'));}
  finally{for(const [name,original] of saved)proto[name]=original;captures.clear();}
  await settle();
}
async function resizePointer(selector,deltaX,{cancel=false,afterMove=()=>{}}={}){
  const node=q(selector),box=node.getBoundingClientRect(),at={x:box.left+box.width/2,y:box.top+box.height*.45},id=++nextPointer,target=doc.elementFromPoint(at.x,at.y);
  assert(visible(node)&&(target===node||node.contains(target)),'폭 조절 경계가 다른 요소에 가려졌습니다: '+selector);
  const captures=new Map(),saved=new Map(),proto=win.Element.prototype;
  // 활성 브라우저 포인터만 캡처할 수 있으므로, 합성 ID의 캡처만 대신 연결합니다.
  for(const name of ['setPointerCapture','hasPointerCapture','releasePointerCapture']){
    const original=proto[name];saved.set(name,original);proto[name]=function(pointer){if(pointer!==id)return original.call(this,pointer);if(name==='setPointerCapture'){captures.set(id,this);return;}if(name==='hasPointerCapture')return captures.get(id)===this;if(captures.get(id)===this)captures.delete(id);};
  }
  const send=(type,dx=0)=>{const destination=captures.get(id)||node;destination.dispatchEvent(new win.PointerEvent(type,{pointerId:id,pointerType:'mouse',isPrimary:true,bubbles:true,cancelable:true,composed:true,clientX:at.x+dx,clientY:at.y,button:0,buttons:type==='pointerup'||type==='pointercancel'?0:1}));};
  try{
    send('pointerdown');await settle();send('pointermove',deltaX);await settle();await afterMove();send(cancel?'pointercancel':'pointerup',deltaX);await settle();
  }finally{
    if(captures.has(id))send('pointercancel',deltaX);
    for(const [name,original] of saved)proto[name]=original;captures.clear();
  }
}
