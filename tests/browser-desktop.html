<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC 스튜디오 DOM 통합 검사</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#101213;color:#e5e9e6;font:14px/1.6 system-ui,sans-serif;overflow:auto}main{width:1280px;max-width:none}h1{margin:0 0 8px;font-size:23px}p{margin:7px 0;color:#a8b3ae}button{padding:11px 17px;border:0;border-radius:6px;background:#b8ee63;color:#182210;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.4;cursor:wait}.actions{display:flex;align-items:center;gap:15px;margin:17px 0}#frameHost{width:1280px;overflow:visible;border:1px solid #3b4540}#studio{display:block;width:1280px;height:850px;border:0;background:#111}#checks{line-height:1.9;padding-left:24px}#checks [data-result=pass]{color:#b8ee63}#checks [data-result=fail]{color:#ffb0a5}#result{padding:14px;background:#1c2420;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,monospace}
</style>
<body>
<main>
  <h1>PC 스튜디오 DOM 통합 검사</h1>
  <p>별도 검수 주소의 빈 편집기를 사용합니다. 테스트 자막과 퀵포맷을 추가·수정한 뒤 정리하며 AI 처리, 다운로드, 사용자 프로젝트 교체는 실행하지 않습니다.</p>
  <p>실제 앱 DOM과 합성 클릭·입력 이벤트로 UI 연결을 검사합니다. 390px 전환은 브라우저 레이아웃 검증이며 실제 휴대전화의 터치·OS 검증을 대신하지 않습니다.</p>
  <div class="actions"><button id="runAll" disabled>전체 검사 실행</button><span id="status">편집기 준비 중…</span></div>
  <ol id="checks"></ol>
  <pre id="result" role="status">준비 중…</pre>
  <div id="frameHost"><iframe id="studio" title="독립 PC 편집기 검사" src="/studio.html?empty"></iframe></div>
</main>
<script type="module">
// 검수 전용 페이지입니다. 별도 localhost 포트에서 public/_test/desktop.html로 복사합니다.
const $=id=>document.getElementById(id),iframe=$('studio'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
let doc,win,running=false,ready=false;
const errors=[],originals=new Map(),captionText='검수용 자막 · PC와 모바일에서 같은 문구';
const settle=async()=>{await wait(60);await new Promise(resolve=>requestAnimationFrame(resolve));};
const visible=node=>!!node?.isConnected&&node.getClientRects().length>0&&win.getComputedStyle(node).visibility!=='hidden';
const q=selector=>{const node=doc.querySelector(selector);assert(node,'찾을 수 없는 요소: '+selector);return node;};
async function until(check,message,timeout=3000){const end=performance.now()+timeout;while(performance.now()<end){if(check())return;await wait(40);}throw new Error(message);}
async function click(selector){const node=typeof selector==='string'?q(selector):selector;assert(visible(node),'보이지 않는 버튼: '+(node.id||node.outerHTML.slice(0,150)));assert(!node.disabled,'비활성 버튼: '+(node.id||node.textContent));node.click();await settle();}
async function input(selector,value){const node=q(selector);assert(visible(node),'보이지 않는 입력: '+selector);node.focus();node.value=value;node.dispatchEvent(new win.Event('input',{bubbles:true}));node.dispatchEvent(new win.Event('change',{bubbles:true}));await settle();}
function uniqueIds(){const seen=new Set();for(const node of doc.querySelectorAll('[id]')){assert(!seen.has(node.id),'중복 ID: '+node.id);seen.add(node.id);}}
const group=key=>click('[data-desktop-group="'+key+'"]');
const tab=key=>click('[data-desktop-tab="'+key+'"]');
const inspectorTab=key=>click('[data-desktop-inspector="'+key+'"]');
const activeInspector=()=>doc.querySelector('[data-desktop-inspector][aria-pressed="true"]')?.dataset.desktopInspector;
const captions=()=>[...doc.querySelectorAll('.timeline-block[data-type="caption"]')];
const titleOf=node=>[...(node.querySelector('h3')?.childNodes||[])].filter(child=>child.nodeType===3).map(child=>child.textContent).join('').trim();
const captionSections=()=>[...q('#inspectorContent').children].filter(node=>node.matches('.property-section'));
const tests={
  async navigation(){
    assert(doc.querySelectorAll('[data-desktop-group]').length===5,'상위 탐색이 다섯 작업으로 정리되지 않았습니다.');
    const routes=[['files',null,'media'],['captions',null,'captions'],['sound','sounds','sounds'],['sound','voice','voice'],['sound','silence','silence'],['design','quick-format','quick-format'],['design','graphics','graphics'],['design','transitions','transitions'],['tools','mosaic','mosaic'],['tools','crop-tracking','crop-tracking']];
    for(const [destination,subview,view] of routes){await group(destination);if(subview)await tab(subview);assert(doc.body.dataset.desktopView===view,view+' 화면으로 연결되지 않았습니다.');assert(q('[data-desktop-group="'+destination+'"]').getAttribute('aria-pressed')==='true',view+'의 상위 탐색 선택이 틀립니다.');assert(visible(q('#libraryContent')),view+' 화면을 볼 수 없습니다.');}
    assert(q('[data-desktop-group="tools"]').textContent.trim()==='트래킹','트래킹의 상위 이름이 다릅니다.');
    assert([...q('#desktopLibraryTabs').children].map(node=>node.textContent.trim()).join('|')==='모자이크|크롭','트래킹에 모자이크와 크롭만 표시되지 않습니다.');
    await group('sound');assert([...q('#desktopLibraryTabs').children].map(node=>node.textContent.trim()).join('|')==='효과음|AI TTS|무음 컷','소리 탭의 작업 이름이나 순서가 다릅니다.');
    uniqueIds();return '다섯 작업에서 열 화면 접근 · AI TTS/무음 컷과 모자이크/크롭 분리 · 중복 ID 없음';
  },
  async trackLabels(){
    assert(iframe.clientWidth===1280,'트랙 이름은 1280px PC 폭에서 검사해야 합니다.');
    const selectors=[...q('#trackHeaders').querySelectorAll('.track-selector')];assert(selectors.length>=5,'기본 트랙 다섯 개가 표시되지 않습니다.');
    assert(!doc.querySelector('.track-selector small'),'트랙에 의미 없는 순서 숫자가 남았습니다.');
    const labels=selectors.map(node=>node.querySelector('strong').textContent.trim());
    for(const label of ['자막','그래픽','영상','오디오','보이스'])assert(labels.includes(label),label+' 전체 이름을 찾을 수 없습니다.');
    for(const selector of selectors){
      const label=selector.querySelector('strong'),badge=selector.querySelector('.track-code'),box=selector.getBoundingClientRect(),textBox=label.getBoundingClientRect(),badgeBox=badge.getBoundingClientRect();
      assert(visible(label)&&label.scrollWidth<=label.clientWidth+1,'트랙명이 잘립니다: '+label.textContent);
      assert(textBox.right<=box.right+1&&textBox.left>=box.left,'트랙명이 선택 버튼 밖으로 넘칩니다: '+label.textContent);
      assert(Math.abs(badgeBox.width-24)<.5&&Math.abs(badgeBox.height-24)<.5,'트랙 배지 크기가 24×24가 아닙니다: '+badge.textContent);
    }
    const heads=q('.track-heads').getBoundingClientRect(),scroll=q('#timelineScroll').getBoundingClientRect(),tools=q('.edit-tools').getBoundingClientRect(),library=q('#library').getBoundingClientRect(),panel=q('.timeline-panel').getBoundingClientRect();
    assert(heads.width<=185,'트랙 칸에 과도한 빈 폭이 남았습니다.');
    assert(tools.left>=scroll.left&&tools.left>=library.right-1,'편집 도구가 트랙 칸이나 연장한 메뉴 패널과 겹칩니다.');
    assert(Math.abs(library.bottom-scroll.top)<=1&&Math.abs(panel.left)<1,'메뉴 패널이 + 줄을 넘어 트랙까지 내려왔거나 타임라인 전체 폭이 줄었습니다.');
    assert(!visible(q('.timeline-title'))&&!doc.querySelector('#desktopTrackMore'),'타임라인 왼쪽 + 또는 빈 제목 줄이 남았습니다.');
    await click('#trackHeaders .audio-head [data-add-track]');
    assert(doc.querySelectorAll('#trackHeaders .track-selector').length===selectors.length+1,'행의 + 버튼으로 추가한 트랙이 없습니다.');
    for(const label of doc.querySelectorAll('#trackHeaders .track-selector strong'))assert(label.scrollWidth<=label.clientWidth+1,'추가 트랙명이 잘립니다: '+label.textContent);
    await click('#undo');assert(doc.querySelectorAll('#trackHeaders .track-selector').length===selectors.length,'추가 트랙 되돌리기가 실패했습니다.');
    return '184px 트랙 칸·24px 배지·전체 이름, 메뉴는 + 줄까지만 연장, 타임라인 전체 폭 유지';
  },
  async captionPanels(){
    await group('captions');const host=q('#libraryContent'),children=[...host.children];
    assert(q('[data-desktop-tab="styles"]').getAttribute('aria-pressed')==='true','자막 작업의 첫 화면이 직접 자막/스타일이 아닙니다.');
    assert([...q('#desktopLibraryTabs').children].map(node=>node.dataset.desktopTab+':'+node.textContent.trim()).join('|')==='styles:자막|create:자동자막|list:자막 목록','자막 세부 탭의 이름이나 순서가 다릅니다.');
    assert(visible(q('#libraryContent .preset-grid'))&&visible(q('#libraryContent .segmented'))&&visible(q('[data-action="add-caption"]')),'자막 탭에 현재 위치 자막/스타일/적용 대상이 함께 표시되지 않습니다.');
    assert(!visible(q('#libraryContent .smart-card'))&&!visible(q('#captionList')),'자막 탭에 자동자막이나 목록이 섞여 보입니다.');
    await tab('create');assert(visible(q('#libraryContent .smart-card'))&&!visible(q('[data-action="add-caption"]')),'자동자막에 직접 추가 버튼이 섞여 있거나 인식 기능이 없습니다.');
    assert(!visible(q('#libraryContent .preset-grid'))&&!visible(q('#captionList')),'자동자막에 스타일이나 목록이 섞여 보입니다.');
    await tab('list');assert(visible(q('#captionList'))&&visible(q('#libraryContent > .field-grid')),'자막 목록/SRT 메뉴에 접근할 수 없습니다.');assert(!visible(q('#libraryContent .preset-grid'))&&!visible(q('#libraryContent .smart-card')),'목록에 다른 작업 패널이 노출됩니다.');
    assert(children.length===host.children.length&&children.every((node,index)=>node===host.children[index]),'탭 변경이 공유 라이브러리 노드를 복제하거나 재배치했습니다.');
    await tab('styles');return '자막(직접 추가·스타일) → 자동자막 → 목록 분리, 공유 직계 노드와 명령 유지';
  },
  async captionEdit(){
    const before=captions().length;await click('[data-action="add-caption"]');assert(captions().length===before+1,'직접 추가한 자막이 타임라인에 없습니다.');assert(activeInspector()==='basic','새 자막의 기본 편집이 열리지 않았습니다.');
    const text=q('#inspectorContent textarea[data-prop="text"]');assert(visible(text),'기본 탭에서 문구를 바로 편집할 수 없습니다.');text.focus();text.value=captionText;text.dispatchEvent(new win.Event('input',{bubbles:true}));text.dispatchEvent(new win.Event('change',{bubbles:true}));await settle();
    assert(q('#inspectorContent textarea[data-prop="text"]').value===captionText,'문구 변경이 속성 재렌더 후 사라졌습니다.');assert(captions().some(node=>node.textContent.includes(captionText)),'문구 변경이 실제 타임라인 클립에 반영되지 않았습니다.');
    await tab('list');assert(q('#captionList').textContent.includes(captionText),'자막 목록에 변경 내용이 반영되지 않았습니다.');await tab('styles');return '자막 추가 → 기본 문구 입력 → 실제 타임라인·목록 반영';
  },
  async inspectorState(){
    await inspectorTab('style');const decorations=captionSections().filter(visible);assert(decorations.length===3&&decorations.every(node=>['테두리','텍스트 박스','그림자'].includes(titleOf(node))),'꾸미기 속성이 누락되거나 다른 작업 속성이 섞였습니다.');
    await inspectorTab('motion');const channel=q('[data-keyframe-channel]');assert(visible(channel),'움직임에서 키프레임 속성을 고를 수 없습니다.');channel.value='rotation';channel.dispatchEvent(new win.Event('change',{bubbles:true}));await settle();
    assert(activeInspector()==='motion','키프레임 속성 변경 후 기본 탭으로 튀었습니다.');assert(q('[data-keyframe-channel]').value==='rotation','선택한 회전 속성이 유지되지 않습니다.');assert(visible(q('[data-keyframe-value]')),'현재 키프레임 값을 바로 조절할 수 없습니다.');
    assert(!visible(q('#inspectorContent textarea[data-prop="text"]')),'움직임 탭에서도 기본 편집이 함께 표시됩니다.');uniqueIds();return '꾸미기 분리 · 키프레임 속성 변경 뒤 움직임 탭과 슬라이더 유지';
  },
  async menusAndInspector(){
    await click('#desktopCloseInspector');assert(!visible(q('#inspector')),'편집 패널이 접히지 않습니다.');await click('#toggleInspector');assert(visible(q('#inspector')),'미리보기 버튼으로 편집 패널을 다시 열 수 없습니다.');assert(activeInspector()==='motion','패널 재개방 시 현재 작업이 사라졌습니다.');
    const projectMenu=q('.desktop-project-menu');await click(projectMenu.querySelector('summary'));assert(projectMenu.open,'프로젝트 메뉴가 열리지 않습니다.');for(const id of ['saveProject','openProject']){assert(q('#'+id)===originals.get(id),id+' 버튼이 복제됐습니다.');assert(visible(q('#'+id))&&typeof q('#'+id).onclick==='function',id+'의 원래 실행 연결이 사라졌습니다.');}await click(projectMenu.querySelector('summary'));
    await click('#desktopEditMore > summary');for(const id of ['rippleDeleteClip','copyClipSettings','pasteClipSettings']){assert(q('#'+id)===originals.get(id)&&visible(q('#'+id)),id+' 원래 버튼이 추가 도구에 연결되지 않았습니다.');}await click('#copyClipSettings');assert(!q('#desktopEditMore').open,'설정 복사 후 메뉴가 닫히지 않습니다.');assert(!q('#pasteClipSettings').disabled,'실제 설정 복사 명령이 연결되지 않았습니다.');
    assert(!doc.querySelector('#desktopTrackMore'),'제거한 상단 트랙 + 버튼이 남았습니다.');
    assert([...doc.querySelectorAll('#trackHeaders [data-add-track]')].length>=5,'각 행의 트랙 + 버튼이 사라졌습니다.');
    return '편집 패널 재개방 · 프로젝트/추가 편집 메뉴 연결 · 각 트랙의 + 유지';
  },
  async savedQuickFormat(){
    await group('design');await tab('quick-format');
    const previousIds=[...doc.querySelectorAll('[data-quick-use]')].map(node=>node.dataset.quickUse);
    const name='PC 검수 포맷 '+Date.now(),copy='검수 *강조*\n다시 쓰는 상단 문구';let savedId;
    try{
      assert(!doc.querySelector('#quickFormatName'),'저장 전 이름 입력칸이 남았습니다.');
      assert([...doc.querySelectorAll('[data-quick-name]')].every(node=>!visible(node)),'연필을 누르기 전에 이름 편집칸이 보입니다.');
      await click('[data-quick-preset="balanced"]');
      await input('[data-quick-text="top"]',copy);
      await input('[data-quick-position="top"][data-quick-style="background"]','#234567');
      await click('[data-quick-save]');
      const saved=[...doc.querySelectorAll('[data-quick-use]')].find(node=>!previousIds.includes(node.dataset.quickUse));
      assert(saved,'저장한 퀵포맷이 목록에 표시되지 않았습니다.');savedId=saved.dataset.quickUse;
      assert(!previousIds.includes(savedId),'새 포맷이 기존 저장 항목을 덮어썼습니다.');
      const row=()=>q('[data-quick-row="'+savedId+'"]'),nameInput=()=>q('[data-quick-name="'+savedId+'"]');
      const autoName=row().querySelector('.saved-quick-name').textContent;
      assert(/^퀵포맷 [1-9]\d*$/.test(autoName),'퀵포맷 N 자동 이름이 아닙니다.');
      for(const key of ['use','remove','rename']){const action=q('[data-quick-'+key+'="'+savedId+'"]');assert(visible(action)&&action.getAttribute('aria-label')&&action.getAttribute('title')&&action.querySelector('svg'),'적용·삭제·이름 수정 아이콘의 접근성 설명이 없습니다.');}
      await group('files');await group('design');await tab('quick-format');
      assert(visible(q('[data-quick-use="'+savedId+'"]')),'라이브러리를 다시 열자 저장한 퀵포맷이 사라졌습니다.');
      await click('[data-quick-preset="wide"]');await input('[data-quick-text="top"]','다른 문구');
      await input('[data-quick-position="top"][data-quick-style="background"]','#765432');
      await click('[data-quick-rename="'+savedId+'"]');assert(visible(nameInput())&&doc.activeElement===nameInput(),'연필 클릭으로 이름 편집에 포커스가 이동하지 않았습니다.');
      await input('[data-quick-name="'+savedId+'"]','취소할 이름');nameInput().dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));await settle();
      assert(!visible(nameInput())&&row().querySelector('.saved-quick-name').textContent===autoName,'Escape로 이름 수정이 취소되지 않았습니다.');
      await click('[data-quick-rename="'+savedId+'"]');await input('[data-quick-name="'+savedId+'"]',name);nameInput().dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));await settle();
      assert(!visible(nameInput())&&row().querySelector('.saved-quick-name').textContent===name,'Enter로 이름 수정이 확정되지 않았습니다.');
      await click('[data-quick-rename="'+savedId+'"]');await input('[data-quick-name="'+savedId+'"]',name+' 저장');await click('[data-quick-rename-save="'+savedId+'"]');
      assert(row().querySelector('.saved-quick-name').textContent===name+' 저장','이름 저장 버튼으로 수정이 확정되지 않았습니다.');
      await click('[data-quick-use="'+savedId+'"]');
      assert(q('[data-quick-enabled]').checked,'저장한 포맷 적용 후 사용 상태가 꺼졌습니다.');
      assert(q('[data-quick-preset="balanced"]').getAttribute('aria-pressed')==='true','저장한 상하단 여백이 복원되지 않았습니다.');
      assert(q('[data-quick-text="top"]').value===copy,'저장한 줄바꿈/강조 문구가 복원되지 않았습니다.');
      assert(q('[data-quick-position="top"][data-quick-style="background"]').value==='#234567','저장한 상단 배경색이 복원되지 않았습니다.');
    }finally{
      const cancel=savedId&&doc.querySelector('[data-quick-rename-cancel="'+savedId+'"]');if(cancel&&visible(cancel))await click(cancel);
      if(savedId&&doc.querySelector('[data-quick-remove="'+savedId+'"]'))await click('[data-quick-remove="'+savedId+'"]');
    }
    assert(!doc.querySelector('[data-quick-use="'+savedId+'"]'),'테스트 퀵포맷 삭제가 목록에 반영되지 않았습니다.');
    assert([...doc.querySelectorAll('[data-quick-use]')].map(node=>node.dataset.quickUse).join('|')===previousIds.join('|'),'기존 저장 포맷 목록이 변경됐습니다.');
    return '자동 이름 저장 → 연필 이름 수정·Enter/저장·Escape → 기존 저장 설정 복원 → 테스트 저장 항목 삭제';
  },
  async mobileRoundTrip(){
    const nodes=new Map(['library','inspector'].map(id=>[id,q('#'+id)]));nodes.set('viewer',q('.viewer'));nodes.set('timeline',q('.timeline-panel'));const parents=new Map([...nodes].map(([key,node])=>[key,node.parentElement]));

  },
};
async function run(){
  if(running||!ready)return;running=true;errors.length=0;$('checks').replaceChildren();$('runAll').disabled=true;document.body.dataset.result='running';$('status').textContent='검사 중…';$('result').textContent='실제 앱 버튼과 입력으로 검사 중…';const outcomes=[];
  try{for(const [name,check] of Object.entries(tests)){const row=document.createElement('li');row.dataset.test=name;$('checks').append(row);try{const message=await check();assert(!errors.length,errors.join('\n'));outcomes.push({name,pass:true,message});row.dataset.result='pass';row.textContent='PASS · '+message;}catch(error){outcomes.push({name,pass:false,error:error.stack||String(error)});row.dataset.result='fail';row.textContent='FAIL · '+name+' · '+error.message;break;}}
    const passed=outcomes.every(item=>item.pass)&&outcomes.length===Object.keys(tests).length;document.body.dataset.result=passed?'pass':'fail';window.__desktopQaResult=outcomes;$('status').textContent=passed?'전체 통과':'실패 항목 확인';$('result').textContent=passed?outcomes.length+' / '+outcomes.length+' PASS — 실제 앱 DOM 통합 검사. 실제 기기와 수동 영상 편집 검수는 별도입니다.':outcomes.filter(item=>!item.pass).map(item=>item.error).join('\n\n');
  }finally{iframe.style.width='1280px';iframe.style.height='850px';running=false;$('runAll').disabled=false;}
}
$('runAll').onclick=run;
try{
  await until(()=>iframe.contentDocument?.documentElement?.dataset.studioReady==='true','편집기 초기화/폰트 준비가 20초 안에 완료되지 않았습니다.',20000);doc=iframe.contentDocument;win=iframe.contentWindow;
  win.addEventListener('error',event=>{if(running)errors.push(event.error?.stack||event.message);});win.addEventListener('unhandledrejection',event=>{if(running)errors.push(event.reason?.stack||String(event.reason));});
  assert(doc.body.classList.contains('desktop-ui'),'처음부터 PC 전용 레이아웃이 아닙니다.');assert(captions().length===0,'빈 프로젝트가 아닌 기존 자막을 감지했습니다.');for(const id of ['saveProject','openProject','rippleDeleteClip','copyClipSettings','pasteClipSettings'])originals.set(id,q('#'+id));
  ready=true;document.body.dataset.result='ready';$('runAll').disabled=false;$('status').textContent='준비 완료 · '+Object.keys(tests).length+'개 검사';$('result').textContent='전체 검사 실행을 누르세요.';
}catch(error){document.body.dataset.result='fail';$('status').textContent='초기화 실패';$('result').textContent='FIXTURE FAIL: '+error.stack;}
